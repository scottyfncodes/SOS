name: Deploy GitHub Pages

on:
  push:
    branches:
      # This repo has no `main` — claude/open-run-build-complete-rrk4y7 is
      # the actual default branch (and the github-pages environment's
      # deployment-branch rule only allows deploys from it).
      - claude/open-run-build-complete-rrk4y7
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
