/* ---- Weather ---- */
function renderWeather(){
  var html = '<div class="breadcrumb"><button data-go="home">&larr; Home</button></div>';
  html += '<div class="section"><h2>&#9928; Weather</h2>';
  html += '<h3>Lightning - the 30-30 rule</h3><p>If the gap between seeing lightning and hearing thunder is less than 30 seconds, take shelter. Wait 30 minutes after the last thunder before going back outside. Avoid open fields, isolated tall trees, water, and metal objects. Caught in the open, crouch low on the balls of your feet - don\'t lie flat.</p>';
  html += '<h3>Extreme heat</h3><p>Drink water before you feel thirsty. Seek shade during peak midday hours. Wear light, loose clothing. Watch companions for heat exhaustion/heat stroke signs (see First Aid).</p>';
  html += '<h3>Extreme cold / wind chill</h3><p>Layer clothing and cover extremities - most heat is lost from the head, hands, and feet. Watch for frostbite: numbness and white or waxy-looking skin. Stay dry; wet clothing loses insulating value fast.</p>';
  html += '<h3>Flash floods</h3><p>Never cross moving water: 6 in (15 cm) can knock an adult off their feet, and 12-24 in (30-60 cm) can float a vehicle. Move to higher ground immediately during heavy rain and avoid camping in dry washes or canyon bottoms.</p>';
  html += '<h3>Tornado</h3><p>Get to the lowest level, interior room, away from windows. Avoid vehicles and mobile structures. If caught outside with no shelter, lie flat in a low ditch and cover your head.</p>';
  html += '<h3>Hurricane / high wind</h3><p>Secure or shelter well before arrival. Avoid coastal and flood-prone areas. Prepare for extended power and communication outages.</p>';
  html += '</div>';
  return html;
}

/* ---- Wildlife ---- */
function renderWildlife(){
  var html = '<div class="breadcrumb"><button data-go="home">&larr; Home</button></div>';
  html += '<div class="section"><h2>&#128062; Wildlife</h2>';
  html += '<h3>Bear encounters</h3><p>Never run - it can trigger a chase instinct. Speak in a low, calm voice and back away slowly, giving the bear an escape route. Make yourself look larger and use bear spray if charged. If a brown/grizzly bear makes contact, play dead: lie flat, protect your neck and head. If a black bear attacks, fight back aggressively, targeting the face and muzzle. Store food well away from your camp using a hang or canister.</p>';
  html += '<h3>Snakes</h3><p>Give snakes a wide berth and watch where you step and reach, especially around rocks and brush. Most bites happen when a snake is handled or provoked - leave them alone. If bitten, use the First Aid snake bite flow.</p>';
  html += '<h3>Mountain lion / cougar</h3><p>Don\'t run. Make noise, appear as large as possible, and keep children close and picked up. If attacked, fight back hard, targeting the eyes and face.</p>';
  html += '<h3>Insect stings &amp; allergic reactions</h3><p>Remove a stinger by scraping it out sideways (not pinching, which injects more venom). Watch for signs of a severe allergic reaction - see First Aid &gt; Allergic reaction.</p>';
  html += '<h3>Ticks</h3><p>Check your whole body after time in brush or woods. Remove a tick promptly using fine-tipped tweezers, grasping close to the skin, and pulling straight up with steady pressure. Watch for rash or fever in the following weeks.</p>';
  html += '</div>';
  return html;
}

/* ---- Vehicle ---- */
function renderVehicle(){
  var html = '<div class="breadcrumb"><button data-go="home">&larr; Home</button></div>';
  html += '<div class="section"><h2>&#128663; Vehicle Emergencies</h2>';
  html += '<h3>Stranded in snow</h3><p>Stay with the vehicle - it\'s far easier for rescuers to find than a person on foot. Run the engine about 10 minutes each hour for heat, cracking a window for ventilation. Make sure the exhaust pipe isn\'t blocked by snow (carbon monoxide risk). Stay visible: tie bright cloth to the antenna, use the dome light at night. Keep moving your arms and legs to maintain circulation.</p>';
  html += '<h3>Breakdown on the road</h3><p>Pull as far off the roadway as possible and turn on hazard lights. Place flares or reflective triangles behind the vehicle if available. If it\'s safer, exit away from traffic to a location off the road; if you stay inside, keep your seatbelt on.</p>';
  html += '<h3>Stuck in mud or sand</h3><p>Don\'t spin the wheels - it digs you in deeper. Clear debris/sand from around the tires, use traction aids like boards or floor mats, and for sand, slightly deflating tires can help. Rock the vehicle gently forward and back if safe to do so.</p>';
  html += '<h3>Overheating engine</h3><p>Pull over safely and turn off the AC, turning on the heater to draw heat away from the engine. Let it cool 15-20 minutes before opening the hood. Never open a hot radiator cap - pressurized coolant can cause severe burns.</p>';
  html += '<h3>Submerged / sinking vehicle</h3><p>Unbuckle your seatbelt immediately and open a window or break it right away, before the vehicle fully submerges - power windows and doors can fail once underwater. Get out through the window if the door won\'t open, get children or the lightest occupants out first, then swim to the surface.</p>';
  html += '<h3>Keep in the vehicle</h3><p>Blanket, water, flashlight, basic tools, jumper cables, and some food make up a solid baseline emergency kit.</p>';
  html += '</div>';
  return html;
}

/* ---- Long-Term Survival ---- */
function renderLongTerm(){
  var html = '<div class="breadcrumb"><button data-go="home">&larr; Home</button></div>';
  html += '<div class="section"><h2>&#127806; Long-Term Survival</h2>';
  html += '<p>For extended, infrastructure-down scenarios rather than a single emergency: growing and preserving food, staying healthy without hospitals, and building resilience over months, not hours.</p>';
  html += '<div class="jump-row">'+
    '<a class="jump-chip" href="#lt-farming">Farming</a>'+
    '<a class="jump-chip" href="#lt-plants">Plants</a>'+
    '<a class="jump-chip" href="#lt-preservation">Preservation &amp; Water</a>'+
    '<a class="jump-chip" href="#lt-health">Sanitation &amp; Medicine</a>'+
    '<a class="jump-chip" href="#lt-barter">Barter</a>'+
    '<a class="jump-chip" href="#lt-power">Power &amp; Tools</a>'+
    '<a class="jump-chip" href="#lt-community">Community</a>'+
  '</div></div>';

  html += '<div class="section" id="lt-farming"><h2>&#127793; Farming &amp; Food Production</h2>';
  html += '<h3>Start with reliable staples</h3><p>Corn, beans, and squash are traditionally grown together as the "Three Sisters": the corn stalks support climbing bean vines, beans fix nitrogen into the soil for the other two, and squash leaves shade out weeds and hold in moisture.</p>';
  html += '<ul><li><b>Potatoes</b> - calorie-dense and store well through winter in a cool, dark space.</li><li><b>Beans</b> - a reliable protein source that also improves the soil they grow in.</li><li><b>Squash</b> - many varieties store for months without refrigeration.</li><li><b>Leafy greens</b> - fast-growing (30-60 days), useful for quick nutrition between larger harvests.</li></ul>';
  html += '<h3>Seed saving</h3><p>Only open-pollinated or heirloom seeds reliably breed true year after year - most hybrid seeds do not. Beans, peas, tomatoes, peppers, and lettuce are the easiest crops to save seed from, since they are self-pollinating and rarely cross with other varieties. Dry seeds completely before storing them in a cool, dark, dry container; well-dried seeds can remain viable for several years.</p>';
  html += '<h3>Composting and soil building</h3><p>Alternate "greens" (kitchen scraps, grass clippings, for nitrogen) with "browns" (dry leaves, cardboard, straw, for carbon). Turn the pile every couple of weeks to add oxygen, and keep it about as damp as a wrung-out sponge. Leave out meat, dairy, and fats in a basic compost pile, since they attract pests and smell. Finished compost usually takes a few months to a year.</p>';
  html += '<h3>Basic livestock</h3><p>Chickens and rabbits are the two most practical animals to start with: both breed quickly, need modest space, and convert scraps and forage into food. Chickens provide eggs without needing to be slaughtered, but require a secure, predator-proof coop. Rabbits are quiet, breed fast, and convert grass efficiently into meat, but require dedicated care through slaughter. Keep any livestock housing predator-proof and well ventilated.</p>';
  html += '</div>';

  html += '<div class="section" id="lt-plants"><h2>&#127807; Edible &amp; Poisonous Plants</h2>';
  html += '<p>Misidentifying a wild plant can be fatal. Never eat anything from a plant you cannot positively identify, and cross-check more than one source before relying on any wild plant as food.</p>';
  html += '<h3>Common, widespread edibles</h3><table class="ref-table"><tr><th>Plant</th><th>Notes</th></tr>'+
    '<tr><td>Dandelion</td><td>Leaves, flowers, and roots are all edible; leaves grow more bitter as the plant matures.</td></tr>'+
    '<tr><td>Plantain (the weed, not the fruit)</td><td>Broad, low-growing leaves; also used topically as a poultice for minor skin irritation and stings.</td></tr>'+
    '<tr><td>Cattail</td><td>Young shoots and roots are edible; grows in wet ground near water.</td></tr>'+
    '<tr><td>Clover</td><td>Edible in small amounts, best cooked; raw clover in quantity can cause bloating.</td></tr>'+
    '<tr><td>Chickweed</td><td>Low, tender edible green common in disturbed soil and gardens.</td></tr>'+
    '<tr><td>Wild blackberry / raspberry</td><td>Recognizable bramble fruit; avoid unfamiliar white or pale berries entirely.</td></tr>'+
    '</table>';
  html += renderWarning("Dangerous look-alikes", ["Poison hemlock and water hemlock closely resemble wild carrot (Queen Anne's Lace) and wild parsnip - both hemlocks are extremely toxic and can be fatal in small amounts. Hemlock stems usually show purple blotches and are smooth; wild carrot stems are hairy.","Death cap and destroying angel mushrooms closely resemble edible varieties - never eat wild mushrooms without expert identification. Symptoms can appear many hours after serious damage is already done.","Pokeweed berries look like edible dark berries, but the entire plant is toxic.","Treat any white or pale berries as inedible by default."]);
  html += '<h3>If you can\'t identify a plant</h3><p>Don\'t eat it. Some of the most dangerous plants and mushrooms - including death cap mushrooms and water hemlock - cause no warning taste, smell, or reaction until serious, often irreversible harm is already done, so field self-testing is not a reliable way to tell a plant is safe. A person can survive roughly three weeks without food, which is almost always enough margin to stick to sources you can positively identify from more than one reliable reference, prioritize known-safe food and water, and wait for rescue or resupply instead.</p>';
  html += '</div>';

  html += '<div class="section" id="lt-preservation"><h2>&#128230; Food Preservation &amp; Long-Term Water</h2>';
  html += '<h3>Drying</h3><p>The oldest and most reliable preservation method - it removes the moisture pathogens need to grow. Thin-slice meat or vegetables and dry using sun, air, or gentle heat until leathery and brittle, then store fully dried food in a sealed, dry container.</p>';
  html += '<h3>Smoking</h3><p>Cold smoking adds flavor and some short-term preservation at low temperatures without fully cooking the food. Hot smoking cooks the meat while adding smoke flavor and extends storage somewhat longer. Neither replaces proper curing or refrigeration for long-term safety.</p>';
  html += '<h3>Salt curing and brining</h3><p>Salt draws out moisture and creates an environment hostile to most bacteria. A basic dry cure works salt thoroughly into meat, then leaves it in a cool location for days depending on thickness. Brining (salt dissolved in water) works similarly for smaller cuts.</p>';
  html += '<h3>Root cellaring</h3><p>A cool, humid, dark space - a dug-out cellar, buried barrel, or unheated basement corner - can store root vegetables for months. Potatoes, carrots, beets, and cabbage store well; leafy greens and most fruit do not.</p>';
  html += '<h3>Canning</h3><p>High-acid foods (fruit, pickles, most tomatoes) can be safely preserved with a water-bath canner. Low-acid foods (most vegetables, meat) require pressure canning to reach a high enough temperature to destroy Clostridium botulinum spores.</p>';
  html += renderWarning("Botulism risk", ["Never water-bath can low-acid vegetables or meat - it does not reach a temperature high enough to kill botulism spores.","Discard any canned food with a bulging lid, off smell, or spurting liquid when opened. Do not taste it to check."]);
  html += '<h3>Long-term water</h3><p>Rainwater catchment from a roof into a covered, food-grade container is one of the most reliable long-term water sources; divert the first flush of runoff, which carries the most roof debris, away from storage. A simple biosand or ceramic filter can make cloudy water usable for washing, and combined with boiling or chemical treatment, safer to drink. Rotate stored drinking water every six to twelve months and keep containers out of direct sunlight.</p>';
  html += '</div>';

  html += '<div class="section" id="lt-health"><h2>&#129532; Sanitation, Hygiene &amp; Extended Medicine</h2>';
  html += renderWarning("Sanitation is a priority, not an afterthought", ["Poor sanitation has historically caused more deaths after a disaster than violence or starvation - treat it accordingly."]);
  html += '<h3>Latrines</h3><p>A simple cathole - roughly 6-8 in (15-20 cm) deep, at least 200 ft (60 m) from any water source - works for a short stay. For longer-term use, a deeper pit latrine with a simple cover and seat reduces smell and flies; add a layer of ash or dry soil after each use to speed breakdown and control odor.</p>';
  html += '<h3>Handwashing without plumbing</h3><p>A "tippy-tap" - a hanging, tilted container with a small hole that releases a trickle of water when tipped by a foot pedal or string - uses very little water for effective handwashing. Ash can serve as a rough soap substitute in a true emergency. Wash hands after using the latrine, before handling food or water, and after handling raw meat.</p>';
  html += '<h3>Extended wound care</h3><p>Without access to a hospital, clean wounds daily with the cleanest available water, change dressings regularly, and watch closely for spreading redness, warmth, red streaking, fever, or pus - all signs of infection needing urgent care if at all possible. Raw honey has genuine antimicrobial properties and has been used as a wound dressing when nothing else is available.</p>';
  html += '<h3>Managing chronic conditions</h3><p>Stockpiling a longer supply of any regular medication, along with a written list of dosages and conditions, is worth far more than any improvised alternative. Herbal or folk remedies are not a substitute for insulin, blood pressure medication, or other prescribed treatment.</p>';
  html += '<h3>Herbal remedies (supportive care only)</h3>';
  html += renderWarning("Not a substitute for real medicine", ["Herbal remedies are supportive care at best, not a substitute for antibiotics or emergency medical treatment.","When in doubt about a plant's identity or safety, do not use it medicinally."]);
  html += '<p>A few widely documented supportive uses: crushed plantain leaf as a poultice for minor skin irritation or insect stings, garlic for its mild antimicrobial properties in food, and chamomile or mint as a calming tea. None of these treat serious infection, injury, or illness.</p>';
  html += '</div>';

  html += '<div class="section" id="lt-barter"><h2>&#128260; Barter &amp; Scavenging</h2>';
  html += '<h3>What holds trade value</h3><p>Small, practical, consumable goods tend to hold the most trade value: batteries, over-the-counter medication and first aid supplies, hygiene products, hand tools, seeds, fuel, and clean water containers. Skills - the ability to fix things, treat injuries, or grow food - are often worth more than any physical good.</p>';
  html += '<h3>Scavenging safely</h3><ul>'+
    '<li>Avoid entering a structure alone if possible, and tell someone where you are going.</li>'+
    '<li>Test floors and stairs before putting full weight on them - fire, water, and time weaken structures quickly.</li>'+
    '<li>Watch for gas smells, standing water near electrical sources, and mold - all can be more dangerous than the search itself.</li>'+
    '<li>Note your exit before going further inside.</li>'+
    '<li>Take only what is needed and can be carried - overloading slows you down when it matters most.</li>'+
  '</ul></div>';

  html += '<div class="section" id="lt-power"><h2>&#128295; Off-Grid Power &amp; Tool Maintenance</h2>';
  html += '<h3>Basic solar and battery power</h3><p>A small solar panel paired with a battery bank can keep essentials running - a radio, lights, and small medical devices - though it will not power large appliances. Prioritize charging what actually matters (communication, light, medical needs) over convenience items, and keep panels clean and angled toward the sun for the best output.</p>';
  html += '<h3>Hand-crank and battery basics</h3><p>Hand-crank radios and flashlights remove batteries as a point of failure entirely. Store spare batteries in a cool, dry place, and rotate stock so nothing sits unused for years.</p>';
  html += '<h3>Tool maintenance</h3><p>A well-maintained hand tool will outlast several cheap replacements. Keep cutting edges sharp - a dull blade is more dangerous, not less, since it requires more force to use. Wipe metal tools dry and lightly oil them to prevent rust, especially in humid conditions. Learning basic repair - resharpening, re-handling, patching - matters more long-term than any single tool owned.</p>';
  html += '</div>';

  html += '<div class="section" id="lt-community"><h2>&#129309; Community Resilience</h2>';
  html += '<h3>Low profile</h3><p>Avoid signaling that supplies are available when others may not have them - lit windows at night, visible food stores, or loose talk about what is stocked can draw unwanted attention. This is not about secrecy from trusted neighbors, but about not broadcasting vulnerability to strangers.</p>';
  html += '<h3>Mutual aid</h3><p>A small, trusted group pooling skills and labor is consistently more resilient than any individual or household alone - one person who can treat injuries, one who can fix things, and one who can grow food cover far more ground together than any one of them could alone. Build these relationships before they are needed.</p>';
  html += '<h3>Conflict de-escalation</h3><p>The safest outcome in almost any tense encounter is the one that ends without confrontation. Stay calm, keep hands visible, give people an easy way to back down without losing face, and prioritize disengaging and creating distance over standing your ground. Avoiding a conflict entirely is always the better outcome than winning one.</p>';
  html += '</div>';

  return html;
}

/* ---- Rebuild (restarting from zero) ---- */
function renderRebuild(){
  var html = '<div class="breadcrumb"><button data-go="home">&larr; Home</button></div>';
  html += '<div class="section"><h2>&#127959; Rebuild From Zero</h2>';
  html += '<p>When help is not coming back for years, not weeks. This is the bootstrap order: the knowledge that turns a surviving group into a working community. It builds on <button type="button" class="linklike" data-go="cat:longterm">Long-Term Survival</button>. Read it now, while you have time, and <button type="button" class="linklike" data-go="printall">print the full guide</button> so it outlives this device.</p>';
  html += '<div class="jump-row">'+
    '<a class="jump-chip" href="#rb-order">Priorities</a>'+
    '<a class="jump-chip" href="#rb-health">Public Health</a>'+
    '<a class="jump-chip" href="#rb-food">Staple Food</a>'+
    '<a class="jump-chip" href="#rb-chem">Basic Chemistry</a>'+
    '<a class="jump-chip" href="#rb-materials">Materials</a>'+
    '<a class="jump-chip" href="#rb-metal">Metal</a>'+
    '<a class="jump-chip" href="#rb-power">Power &amp; Machines</a>'+
    '<a class="jump-chip" href="#rb-knowledge">Knowledge</a>'+
  '</div></div>';

  html += '<div class="section" id="rb-order"><h2>&#129517; Order of Operations</h2>';
  html += '<p>The most common failure is working on the wrong problem. Solve these in order; each layer depends on the one before it.</p>';
  html += '<table class="ref-table"><tr><th>When</th><th>Focus</th></tr>'+
    '<tr><td>First days</td><td>Safety, treat injuries, safe water, shelter and warmth. Account for every person.</td></tr>'+
    '<tr><td>First weeks</td><td>Latrines away from water, handwashing, a food inventory, a rationing plan, and one person in charge of each job.</td></tr>'+
    '<tr><td>First season</td><td>Plant fast crops, save every viable seed, set up rainwater catchment, gather tools, metal, fuel, and medicine before they spoil or are taken.</td></tr>'+
    '<tr><td>First year</td><td>Staple grain and legume fields, food preservation for winter, firewood cut a year ahead, soap, and a written record of everything learned.</td></tr>'+
    '<tr><td>Years 2-5</td><td>Draft animals, pottery and brick, a forge, water or wind power, schooling for children, and fair rules the group agrees on.</td></tr>'+
    '</table>';
  html += '<h3>Scavenge before you make</h3><p>For the first several years, the ruins of the old world are a better source of metal, glass, cloth, rope, tools, and chemicals than anything you can produce. A single car holds steel, copper wire, a battery, an alternator, glass, and rubber. Making things from raw materials is the fallback when salvage runs out, and practicing it early keeps the skill alive for when it does.</p>';
  html += '</div>';

  html += '<div class="section" id="rb-health"><h2>&#129534; Public Health: The Biggest Lifesaver</h2>';
  html += '<p>Before modern medicine, most deaths came from infection, contaminated water, and diarrhea. A few ideas prevent most of them, no hospital needed.</p>';
  html += '<h3>Germ theory, applied</h3><ul>'+
    '<li>Invisible microbes cause infection. They spread by dirty hands, feces-contaminated water, coughs, and insects.</li>'+
    '<li>Wash hands with soap after the latrine and before food. This alone sharply cuts diarrheal disease.</li>'+
    '<li>Boil drinking water, or treat it, unless it comes from a protected source you trust.</li>'+
    '<li>Keep latrines downhill and at least 200 ft (60 m) from wells and streams.</li>'+
    '<li>Boil instruments, needles, and cloth used on wounds for 10+ minutes before use.</li>'+
    '<li>Separate the sick. Have one person care for them, and have that person wash every time.</li>'+
  '</ul>';
  html += '<h3>Oral rehydration solution (ORS)</h3><p>Diarrhea kills by dehydration, and this simple drink has saved millions of lives. Mix <b>1 liter (about 1 quart) of clean water + 6 level teaspoons sugar + 1/2 level teaspoon salt</b>. Sip it steadily, even while vomiting. Keep breastfeeding infants. Too much salt is harmful, so measure carefully and never guess.</p>';
  html += '<h3>Clean birth</h3><p>The WHO "cleans": clean hands, a clean surface, a clean (boiled) blade and ties for the cord, and nothing applied to the cord stump. Dry the baby and keep them warm, skin to skin on the mother. Start breastfeeding within the first hour. Heavy bleeding after birth is the top danger: massaging the top of the uterus firmly through the belly and putting the baby to the breast both help it contract.</p>';
  html += '<h3>Alcohol as antiseptic</h3><p>Alcohol disinfects best around 60-90% strength. Ordinary wine or beer is far too weak. Distilled spirits can be concentrated further by distillation, but distilling risks fire and methanol (the first liquid out of the still). That makes the product unsafe to drink, so keep it for external use only.</p>';
  html += renderWarning("Limits", ["None of this replaces antibiotics, surgery, or insulin. Scavenge and carefully store any real medicine, and keep a written record of what each one is for, its dose, and its expiry date.","Most tablet medicines lose potency slowly past their expiry date rather than turning toxic, but liquid medicines, insulin, and some antibiotics degrade faster. Store everything cool, dark, and dry."]);
  html += '</div>';

  html += '<div class="section" id="rb-food"><h2>&#127806; Staple Food at Scale</h2>';
  html += '<p>Gardens feed families. Fields feed communities. Calories come from grains, legumes, and tubers, not from leafy greens.</p>';
  html += '<h3>The staples</h3><ul>'+
    '<li><b>Grains</b> (corn, wheat, oats, barley, rice) store dry for years and are the backbone of every historical civilization.</li>'+
    '<li><b>Legumes</b> (beans, peas, lentils) supply protein and put nitrogen back into the soil. Grains plus legumes together give complete protein.</li>'+
    '<li><b>Tubers</b> (potatoes, sweet potatoes) give the most calories per unit of land, but store less well than dry grain.</li>'+
  '</ul>';
  html += '<h3>The Three Sisters</h3><p>Corn, beans, and squash grown together: corn stalks give the beans something to climb, the beans fix nitrogen, and the broad squash leaves shade out weeds and hold in moisture.</p>';
  html += '<h3>Crop rotation</h3><p>Planting the same crop in the same place drains the soil and builds up pests. A simple 4-bed cycle works: <b>legumes</b> &rarr; <b>leafy and heavy feeders</b> (corn, cabbage) &rarr; <b>roots</b> &rarr; <b>rest or cover crop</b>, then repeat. Return all manure and compost to the fields. Soil fertility is your real wealth.</p>';
  html += '<h3>Seed saving at scale</h3><p>Save seed from many plants, not just the best one. For corn, aim for 100+ plants, because a small seed pool inbreeds and yields collapse within a few generations. Keep a seed reserve of at least two years in case one harvest fails.</p>';
  html += '<h3>Nixtamalize corn</h3><p>If corn is a main staple, cook dried kernels in water with wood ash or slaked lime, soak them overnight, then rinse. This frees niacin. Communities living mostly on untreated corn develop pellagra (skin rash, diarrhea, confusion).</p>';
  html += renderWarning("Hidden deficiencies", ["Scurvy (bleeding gums, poor healing) appears after about 1-3 months without vitamin C. Fresh vegetables, fruit, sprouted seeds or grains, and pine-needle tea all provide it.","Iodine deficiency causes goiter and harms child development. Iodized salt stores indefinitely, and seafood and seaweed supply iodine naturally."]);
  html += '</div>';

  html += '<div class="section" id="rb-chem"><h2>&#9879; Basic Chemistry From Wood, Ash &amp; Stone</h2>';
  html += '<h3>Charcoal</h3><p>Charcoal burns much hotter and cleaner than wood, and a forge, a kiln hot enough for good pottery, or metal smelting all depend on it. Stack hardwood tightly, cover it with earth or sod leaving small vents, light it, and let it smolder with very little air for a day or more until the smoke turns thin and bluish. Then seal every vent and let it cool completely before opening. The goal is to cook the wood, not burn it.</p>';
  html += '<h3>Lye from wood ash</h3><p>Pour rainwater slowly through hardwood ash packed in a container with a straw or cloth filter at the bottom, and collect the brown liquid that drips out. That liquid is lye (potassium hydroxide solution). It is strong enough for soap when a fresh egg floats in it with a coin-sized patch showing. Pass the liquid through the ash again to make it stronger.</p>';
  html += '<h3>Soap</h3><p>Fat plus lye makes soap. Render animal fat (tallow or lard) clean, then slowly stir it into warm lye and keep stirring or boiling until it thickens like pudding. Wood-ash lye usually gives soft soap. Add salt near the end to get firmer soap. Let it cure several weeks before using it on skin.</p>';
  html += '<h3>Lime</h3><p>Burning limestone, chalk, or seashells in a very hot fire or kiln (about 900&deg;C / 1650&deg;F) makes quicklime. Adding water to quicklime slakes it into hydrated lime, and it gets very hot while it does. Lime makes mortar and plaster (lime + sand + water, which hardens slowly in air) and whitewash. It also raises the pH of acidic soil, disinfects latrines, and is used to nixtamalize corn.</p>';
  html += '<h3>Vinegar</h3><p>Leave any fruit juice or sweet liquid to ferment into alcohol, then leave it exposed to air (covered with cloth) for weeks, and it turns to vinegar. Vinegar pickles and preserves food and works as a mild cleaner.</p>';
  html += renderWarning("Caustic hazards", ["Lye and quicklime cause severe chemical burns and blindness. Wear eye protection and gloves, add them to water slowly (never water into them), and keep them away from children.","Flush any skin or eye contact with plenty of water for 15+ minutes. Quicklime reacting with water can boil and spatter or ignite nearby materials."]);
  html += '</div>';

  html += '<div class="section" id="rb-materials"><h2>&#129521; Materials: Pottery, Brick, Fiber, Leather</h2>';
  html += '<h3>Pottery</h3><p>Find clay by looking for sticky, smooth soil in stream banks that holds a coil without cracking when you bend it. Mix in about 20-30% sand or crushed old pottery ("temper") so it doesn\'t crack in the fire. Shape it by coiling ropes of clay, and let it dry slowly in shade for days until bone dry. Warm the pieces gradually beside a fire, then bury them in a large hot fire or a simple pit kiln. Open-fired earthenware stays porous but can cook and store food. A proper kiln fired with charcoal makes stronger, more watertight ware.</p>';
  html += '<h3>Brick and building</h3><p>Adobe (mud brick) is clay soil + sand + straw, pressed into wooden molds and sun-dried for weeks. It works well in dry climates. Fired brick lasts much longer in wet climates. Keep walls dry with a stone foundation below and a wide roof overhang above. Lime mortar binds stone and brick.</p>';
  html += '<h3>Cordage and textiles</h3><p>Rope comes from any long, strong fiber: inner tree bark, nettle, hemp, flax, yucca, or grass. Twist two strands the same direction, then wrap them around each other the opposite direction (a "reverse wrap"), and the tension locks them together. For cloth, spin wool or plant fiber into thread with a drop spindle, then weave it on a simple frame loom by passing crosswise threads (weft) over and under lengthwise threads (warp).</p>';
  html += '<h3>Leather</h3><p>Scrape all flesh and fat from the hide, then remove the hair by soaking the hide in wood-ash or lime water. Tan it either by soaking for weeks in a strong brew of oak or other high-tannin bark, or by working in the animal\'s own mashed brain, then smoking it. Untanned hide rots when wet and turns stiff when dry.</p>';
  html += '</div>';

  html += '<div class="section" id="rb-metal"><h2>&#9874; Metal</h2>';
  html += '<p>Cities are mines. Leaf springs, rebar, files, saw blades, and car axles are all ready-made steel. Salvage-and-reforge will serve for a generation or longer before anyone needs to smelt ore.</p>';
  html += '<h3>A basic forge</h3><p>A charcoal fire in a hearth of stone or clay, with forced air blown in through a pipe from below or the side, gets hot enough to work steel. A bellows, a hair dryer on a battery, or a hand-crank blower all work. Use a heavy flat steel block (a section of railroad rail works) as an anvil. Heat steel to a bright orange and hammer it into shape, reheating whenever it fades to dull red. Hammering steel below dull red cracks it.</p>';
  html += '<h3>Hardening and tempering</h3><p>High-carbon steel (files, springs, blades) can be hardened. Heat it until a magnet no longer sticks, then plunge it into oil or water. After that it is hard but brittle. To temper it, polish a spot, reheat gently, and watch the colors run: <b>straw yellow</b> for cutting edges, <b>bronze to purple</b> for tools that take impact, <b>blue</b> for springs. Quench again as soon as the color you want arrives. Mild steel (rebar, sheet metal) barely hardens at all.</p>';
  html += '<h3>Smelting (last resort)</h3><p>A bloomery is a clay chimney furnace about waist-high, fed with alternating layers of charcoal and crushed iron ore (red or brown rock, or bog iron from marshes) and blown with air for hours. It produces a spongy "bloom" of iron and slag that has to be hammered while hot to squeeze out the slag. It takes a lot of charcoal and labor, which is why salvage comes first.</p>';
  html += renderWarning("Forge safety", ["Galvanized (zinc-coated, dull gray crystalline) metal gives off toxic fumes when heated. Strip the coating first or don't use it.","Work in the open air: charcoal fires make carbon monoxide.","Wet or cold tools and molds make molten metal explode. Preheat everything that will touch it."]);
  html += '</div>';

  html += '<div class="section" id="rb-power"><h2>&#9881; Power &amp; Machines</h2>';
  html += '<h3>Simple machines</h3><p>Every mechanism is built from six ideas: <b>lever, wheel and axle, pulley, inclined plane, wedge, screw</b>. Each trades distance for force. A lever with the load 1 unit from the pivot and your hand 5 units away lifts 5 times the weight. A block and tackle with 4 supporting rope strands lifts 4 times what you pull, minus friction. Ramps, rollers, and levers are how people moved stone blocks weighing tons.</p>';
  html += '<h3>Water and wind</h3><p>Moving water is the most reliable pre-industrial power source. An undershot wheel only needs a flowing stream. An overshot wheel, fed from a channel above it, is far more efficient where the water drops. Power from a wheel can run grinding stones, saws, pumps, or a generator. Wind is less steady but works anywhere with open exposure.</p>';
  html += '<h3>Electricity from salvage</h3><p>Moving a magnet near a coil of wire produces electricity, which is how every generator works. Car alternators, DC motors from treadmills or power tools, and permanent-magnet motors can all run as generators if you spin them fast enough with a water wheel, wind rotor, or bicycle. Car and deep-cycle lead-acid batteries store the power. 12-volt LED lighting and radios run directly from them, and a charge controller keeps overcharging from ruining the batteries. Salvaged solar panels keep producing for decades.</p>';
  html += renderWarning("Electrical safety", ["Batteries can deliver huge currents: a wrench across the terminals can weld, burn, or explode. Remove rings and cover terminals.","Charging lead-acid batteries gives off hydrogen. Charge them in ventilated space away from sparks and flame.","Household mains voltage (120/230V) kills. Stay with low-voltage DC unless you truly know the work."]);
  html += '</div>';

  html += '<div class="section" id="rb-knowledge"><h2>&#128214; Knowledge: The Thing Worth Saving</h2>';
  html += '<p>Tools wear out and people die. Knowledge only survives if it is written down and taught.</p>';
  html += '<h3>Write everything down</h3><p>Keep a community logbook: planting dates, harvests, weather, births, deaths, what worked, what failed. Collect every book you can find on medicine, farming, engineering, and chemistry, and store them dry and off the ground. Paper lasts centuries when kept dry. Phones and drives don\'t.</p>';
  html += '<h3>Teach every child to read, write, and do arithmetic</h3><p>Literacy is the tool that copies every other skill. Even an hour a day keeps it alive. Teach the method as well as the facts: guess, test it, observe honestly, and change your mind when the evidence says so. That habit is what rebuilt technology the first time.</p>';
  html += '<h3>Standards of measure</h3><p>Trade and building need shared units. Keep a salvaged tape measure or ruler as the master length and cut copies from it. For weight, 1 liter of water weighs 1 kilogram (1 quart is about 2 lb), so a marked container of water is a mass standard anyone can recreate.</p>';
  html += '<h3>Keeping time and the calendar</h3><p>Solar noon is when a vertical stick\'s shadow is shortest, and at that moment it points due north (in the Northern Hemisphere) or south (Southern). Mark the noon shadow tip each day: the <b>longest</b> noon shadow marks the winter solstice and the <b>shortest</b> the summer solstice. Days between them tell you when to plant. Keep a day count on the wall and restart it at each winter solstice.</p>';
  html += '<h3>Governance</h3><p>Groups fail more often from conflict than from lack of skill. Agree early on how decisions are made, how food and work are shared, and how disputes get settled, and write it down where everyone can see it.</p>';
  html += '</div>';

  return html;
}

/* ---- Natural Disasters ---- */
function renderDisasters(){
  var html = '<div class="breadcrumb"><button data-go="home">&larr; Home</button></div>';
  html += '<div class="section"><h2>&#127755; Natural Disasters</h2>';
  html += '<p>Large-scale geological and environmental events. For storm-specific hazards like lightning, flooding, and high wind, see the Weather category; for being stranded in a vehicle during a storm, see Vehicle Emergencies.</p>';
  html += '<div class="jump-row">'+
    '<a class="jump-chip" href="#nd-earthquake">Earthquakes</a>'+
    '<a class="jump-chip" href="#nd-wildfire">Wildfires</a>'+
    '<a class="jump-chip" href="#nd-tsunami">Tsunamis</a>'+
    '<a class="jump-chip" href="#nd-volcano">Volcanic Ashfall</a>'+
    '<a class="jump-chip" href="#nd-landslide">Landslides</a>'+
  '</div></div>';

  html += '<div class="section" id="nd-earthquake"><h2>&#128165; Earthquakes</h2>';
  html += '<h3>During the shaking</h3>';
  html += renderSteps(["Drop to the ground before it drops you.","Take Cover under a sturdy table or desk if one is nearby.","Hold On to it, and protect your head and neck until the shaking stops.","If in bed, stay there and cover your head with a pillow rather than run for a doorway.","If outdoors, move to an open area away from buildings, trees, and power lines.","If driving, pull over away from overpasses, bridges, and power lines, and stay inside the vehicle until shaking stops."]);
  html += '<h3>After the shaking stops</h3><p>Expect aftershocks. Check for gas leaks by smell or a hissing sound - if suspected, shut off the gas at the main valve and leave the area without using switches, lighters, or anything that could spark. Check for structural damage before re-entering a building, and be cautious around damaged stairs, chimneys, and overhead fixtures.</p>';
  html += renderWarning("What NOT to do", ["Do not run outside during the shaking - falling debris near exits and walls is a leading cause of injury.","Standing in a doorway is an outdated myth - modern doorways are not stronger than the rest of the structure. Get under sturdy furniture instead.","Do not use elevators after an earthquake."]);
  html += '</div>';

  html += '<div class="section" id="nd-wildfire"><h2>&#128293; Wildfires</h2>';
  html += '<h3>Before fire season</h3><p>Know at least two evacuation routes from home in advance, sign up for local emergency alerts, and keep a vehicle fueled and ready during high-risk periods. Create defensible space by clearing dead brush and vegetation roughly 30 ft (9 m) from structures.</p>';
  html += '<h3>If evacuation is ordered</h3><p>Leave immediately rather than waiting to see how close the fire gets. Close all windows and doors, remove flammable curtains, and shut off gas at the meter before leaving if time allows.</p>';
  html += '<h3>If trapped with no escape route</h3>';
  html += renderSteps(["In a vehicle: stay inside, close windows and vents, turn headlights on, get down below window level, and cover yourself with a blanket or jacket as a last resort.","On foot: move to a cleared area away from vegetation, downhill from the fire if possible.","If caught in the open with fire approaching, lie face down in a low spot and cover exposed skin with wet cloth if available."]);
  html += '</div>';

  html += '<div class="section" id="nd-tsunami"><h2>&#127754; Tsunamis</h2>';
  html += '<p>Natural warning signs matter more than waiting for an official alert, since a tsunami can arrive within minutes of a nearby earthquake.</p>';
  html += renderWarning("Move to high ground immediately if", ["You feel a strong or long-lasting earthquake near the coast.","The ocean suddenly and unusually recedes, exposing the sea floor.","You hear a loud, unusual roaring sound from the ocean."]);
  html += '<p>Move inland or to high ground - as a rough guide, at least 100 ft (30 m) of elevation or one to two miles (1.5-3 km) inland. If caught in the water, grab onto floating debris and try to reach higher structure. Do not return to the coast until officials confirm it is safe - tsunamis often arrive as a series of waves over several hours, and later waves can be larger than the first.</p>';
  html += '</div>';

  html += '<div class="section" id="nd-volcano"><h2>&#127755; Volcanic Ashfall</h2>';
  html += '<p>Even far from an eruption itself, falling ash is the hazard most people actually encounter.</p>';
  html += '<h3>Ashfall</h3><p>Stay indoors with windows and doors sealed. Wear an N95 respirator or similar mask outdoors, and swap it for a fresh one if breathing becomes difficult. Avoid driving - ash reduces visibility and can damage engines. Clear ash from flat roofs carefully, since accumulated ash is heavy and heavier still once wet. Cover electronics and outdoor equipment.</p>';
  html += '<h3>Lava and pyroclastic flow</h3><p>Evacuate immediately per official orders. These move far too fast to outrun once close, so the safe window is before the danger zone is declared, not after.</p>';
  html += '</div>';

  html += '<div class="section" id="nd-landslide"><h2>&#9968; Landslides &amp; Mudslides</h2>';
  html += '<h3>Warning signs</h3><ul>'+
    '<li>Cracking sounds from trees, or cracks opening in the ground or pavement.</li>'+
    '<li>A sudden increase or decrease in stream or creek water levels, especially if it turns muddy.</li>'+
    '<li>Doors or windows sticking for the first time.</li>'+
    '<li>Trees, fences, or retaining walls slowly tilting.</li>'+
  '</ul>';
  html += '<p>If any of these appear during or after heavy rain on steep terrain, move away and uphill, perpendicular to the likely flow path - never cross it. If actually caught in a slide, curl into a tight ball and protect your head.</p>';
  html += '</div>';
  return html;
}

/* ---- Home Survival ---- */
function renderHomeSurvival(){
  var html = '<div class="breadcrumb"><button data-go="home">&larr; Home</button></div>';
  html += '<div class="section"><h2>&#127968; Home Survival</h2>';
  html += '<p>Preparing the place you are most likely to actually be when something goes wrong.</p>';
  html += '<div class="jump-row">'+
    '<a class="jump-chip" href="#hs-kit">Emergency Kit</a>'+
    '<a class="jump-chip" href="#hs-utilities">Utility Shutoffs</a>'+
    '<a class="jump-chip" href="#hs-fire">Fire Safety</a>'+
    '<a class="jump-chip" href="#hs-generator">Generator &amp; CO</a>'+
    '<a class="jump-chip" href="#hs-shelter">Shelter or Evacuate</a>'+
    '<a class="jump-chip" href="#hs-postcheck">Post-Disaster Check</a>'+
  '</div></div>';

  html += '<div class="section" id="hs-kit"><h2>&#127890; Emergency Kit</h2>';
  html += '<p>Build a kit that covers at least 3 days for everyone in the household, stored somewhere accessible you can grab quickly.</p>';
  html += '<ul>'+
    '<li>Water - 1 gallon (4 L) per person per day, minimum 3 days.</li>'+
    '<li>Non-perishable food, minimum 3 days, plus a manual can opener.</li>'+
    '<li>Flashlight and extra batteries, or a hand-crank light.</li>'+
    '<li>First aid kit and at least a week of any regular medications.</li>'+
    '<li>Battery or hand-crank radio for emergency broadcasts.</li>'+
    '<li>Phone charger or power bank.</li>'+
    '<li>Cash in small bills - card readers and ATMs may be down.</li>'+
    '<li>Copies of important documents (ID, insurance, medical) in a waterproof bag.</li>'+
    '<li>Whistle, dust masks, local paper map, basic sanitation supplies.</li>'+
  '</ul></div>';

  html += '<div class="section" id="hs-utilities"><h2>&#128295; Utility Shutoffs</h2>';
  html += '<p>Know the locations before an emergency, not during one.</p>';
  html += '<h3>Gas</h3><p>Only shut off the gas if you smell it, hear hissing, or are told to by officials. Use a wrench kept near the valve to turn it a quarter turn until it is perpendicular to the pipe. Once off, do not turn it back on yourself - leave that to the utility company, since relighting it incorrectly can create an explosion risk.</p>';
  html += '<h3>Water</h3><p>Locate the main shutoff valve, usually near the water meter, so a broken pipe or plumbing failure can be stopped before it floods the home.</p>';
  html += '<h3>Electricity</h3><p>Know the location of the main breaker for a full power cutoff - important before flood water reaches outlets or wiring, or before working on anything electrical.</p>';
  html += '</div>';

  html += '<div class="section" id="hs-fire"><h2>&#128293; Home Fire Safety</h2>';
  html += '<ul>'+
    '<li>Test smoke detectors monthly, replace batteries yearly, and replace the units themselves every 10 years.</li>'+
    '<li>Fire extinguisher use - PASS: Pull the pin, Aim at the base of the fire, Squeeze the handle, Sweep side to side.</li>'+
    '<li>Plan two escape routes from every room and practice a home fire drill.</li>'+
    '<li>Close bedroom doors while sleeping - a closed door measurably slows fire and smoke spread.</li>'+
  '</ul></div>';

  html += '<div class="section" id="hs-generator"><h2>&#9889; Generator &amp; Carbon Monoxide Safety</h2>';
  html += renderWarning("Never run a generator", ["Indoors, in a garage, or in any enclosed space - even with doors open.","Near windows, doors, or vents where exhaust can be drawn inside.","Closer than about 20 ft (6 m) from the house."]);
  html += '<p>Install carbon monoxide detectors near sleeping areas. Symptoms of CO poisoning include headache, dizziness, nausea, and confusion - if suspected, get to fresh air immediately and seek medical help.</p>';
  html += '</div>';

  html += '<div class="section" id="hs-shelter"><h2>&#128737; Shelter in Place or Evacuate</h2>';
  html += '<p>The right call depends on the hazard. A short-duration airborne hazard, such as a nearby chemical spill, often favors sealing a room and sheltering in place. A flood, wildfire, or structural risk usually favors leaving early rather than waiting. Always follow official guidance when it is available.</p>';
  html += '<p>Set up a family communication plan in advance: an out-of-area contact everyone can reach if local lines are down, and an agreed meeting point if the household gets separated.</p>';
  html += '</div>';

  html += '<div class="section" id="hs-postcheck"><h2>&#128269; Post-Disaster Home Check</h2>';
  html += '<p>Before re-entering a home after an earthquake, flood, storm, or fire:</p>';
  html += renderSteps(["Look for structural damage - cracks, leaning walls, or a sagging roofline - before going inside.","Smell for gas and listen for hissing; if detected, do not enter and do not use any switches.","Watch for downed power lines nearby - stay well away and report them rather than moving them.","Avoid standing water near anything electrical.","Photograph damage for insurance before starting cleanup.","Wear sturdy shoes and gloves while inspecting or cleaning up."]);
  html += '</div>';
  return html;
}

/* ---- Pandemic & Illness ---- */

  '</div></div>';

  html += '<div class="section" id="pd-stock"><h2>&#128230; Stockpiling for Illness</h2>';
  html += '<p>On top of the standard emergency kit (see Home Survival), keep at least 2 extra weeks of the following on hand:</p>';
  html += '<ul>'+
    '<li>Thermometer, fever and pain reducers, and an electrolyte or rehydration solution.</li>'+
    '<li>Basic over-the-counter cold and flu medication.</li>'+
    '<li>N95 or similar masks, disposable gloves, and hand sanitizer.</li>'+
    '<li>Household disinfecting supplies for surfaces.</li>'+
    '<li>A pulse oximeter, useful for monitoring respiratory illness at home.</li>'+
    '<li>An extra supply of any regular prescription medications.</li>'+

  html += '<div class="section" id="pd-infection"><h2>&#129440; Infection Control at Home</h2>';

  html += '<div class="section" id="pd-isolation"><h2>&#128683; Isolation &amp; Quarantine Basics</h2>';

  html += '<div class="section" id="pd-care"><h2>&#128680; When To Seek Care</h2>';
  html += renderWarning("Seek urgent medical care for", ["Difficulty breathing or shortness of breath at rest.","Persistent chest pain or pressure.","New confusion or difficulty waking.","Bluish lips or face.","Inability to keep fluids down.","Symptoms that seem to improve, then suddenly worsen again."]);

  html += '</div>';

  html += '<div class="section" id="pd-mental"><h2>&#128172; Isolation &amp; Mental Health</h2>';
  html += '<p>Extended isolation takes a real toll. Keep a daily routine, stay connected with others by phone or video even when physically apart, limit continuous news consumption, and keep moving physically if health allows, even just stretching or walking indoors.</p>';
  html += '</div>';

/* ---- Civil Unrest & Public Safety ---- */
function renderUnrest(){

  html += '<div class="jump-row">'+
    '<a class="jump-chip" href="#cu-awareness">Situational Awareness</a>'+
    '<a class="jump-chip" href="#cu-home">Securing Your Home</a>'+
    '<a class="jump-chip" href="#cu-comms">Communication Blackouts</a>'+
    '<a class="jump-chip" href="#cu-active">Active Threats</a>'+
  '</div></div>';

  html += '<div class="section" id="cu-awareness"><h2>&#128065; Situational Awareness</h2>';
  html += '<ul>'+
    '<li>Follow reliable local news or official channels rather than unverified social media during a developing situation.</li>'+
    '<li>Avoid crowds and known flashpoints where possible, and steer clear of areas with a heavy, tense police or security presence.</li>'+
    '<li>Always have an exit in mind wherever you are, and identify it as soon as you arrive somewhere.</li>'+
    '<li>Trust your instincts - leaving early because something feels wrong costs little; leaving too late can cost a great deal.</li>'+

  html += '<div class="section" id="cu-home"><h2>&#128273; Securing Your Home</h2>';
  html += '<p>Reinforce and lock doors and windows. Keep a low profile - avoid visibly displaying valuables, supplies, or anything that suggests the household is well stocked. Identify an interior room away from windows as a fallback gathering point. Keep your emergency kit and important documents where they can be grabbed quickly if you need to leave.</p>';
  html += '</div>';

  html += '<div class="section" id="cu-comms"><h2>&#128241; Communication When Networks Are Down</h2>';
  html += '<p>Cell networks can become congested or intentionally limited during large-scale unrest. Agree on a family plan in advance: an out-of-area contact everyone can reach, and a physical meeting point if local communication fails (see Home Survival &gt; Shelter in Place or Evacuate). Text messages often get through when voice calls fail, since they need far less bandwidth. Handheld FRS/GMRS radios are a useful backup for short-range family communication that does not depend on cell networks at all.</p>';
  html += '</div>';

  html += '<div class="section" id="cu-active"><h2>&#128680; Active Threats: Run, Hide, Fight</h2>';
  html += '<p>Standard public safety guidance for an active violent threat, in order of preference:</p>';
  html += renderSteps(["Run - if there is a safe escape route, leave the area, leave your belongings behind, and keep your hands visible.","Hide - if you cannot safely leave, get out of the threat's view, lock or barricade the door, stay low, and silence your phone.","Fight - only as an absolute last resort, if your life is in imminent danger and there is no other option, act with full commitment.","Once safe or once help arrives, keep your hands visible and follow the instructions of responding officers."]);
  html += '</div>';
  return html;
}

/* ---- Power Outages ---- */

  html += '<div class="section"><h2>&#128268; Power Outages</h2>';
  html += '<p>Short outages are mostly an inconvenience; the risks show up around food safety, heating, and medical equipment. For generator-specific carbon monoxide safety, see Home Survival.</p>';
  html += '<div class="jump-row">'+
    '<a class="jump-chip" href="#po-food">Food Safety</a>'+
    '<a class="jump-chip" href="#po-heat">Safe Heat &amp; Light</a>'+
    '<a class="jump-chip" href="#po-medical">Medical Equipment</a>'+
    '<a class="jump-chip" href="#po-general">General Steps</a>'+
  '</div></div>';

  html += '<div class="section" id="po-food"><h2>&#129482; Food Safety</h2>';
  html += '<p>An unopened refrigerator keeps food safely cold for about 4 hours. A full freezer holds its temperature for about 48 hours unopened (24 hours if only half full). Use an appliance thermometer if available - when in doubt, discard perishable food that has been above 40&deg;F (4&deg;C) for more than 2 hours.</p>';
  html += '</div>';

  html += '<div class="section" id="po-heat"><h2>&#128367; Safe Heat &amp; Light</h2>';
  html += renderWarning("Never use indoors", ["A charcoal or gas grill, or any outdoor cooking equipment, as an indoor heat source - carbon monoxide risk.","A generator inside the house or garage, even with doors open."]);
  html += '<p>Battery-powered or hand-crank lanterns are safer than open flame. If candles are the only option, never leave them unattended and keep them well clear of anything flammable.</p>';
  html += '</div>';

  html += '<div class="section" id="po-medical"><h2>&#128137; Medical Equipment &amp; Refrigerated Medication</h2>';
  html += '<p>Know in advance how your specific medication tolerates being unrefrigerated - many, including insulin, can handle brief periods at room temperature, but check the guidance for your prescription. A cooler with ice packs can bridge a short outage. For powered medical devices (oxygen concentrators, CPAP machines), have a backup plan: a battery backup, a generator, or a known alternate location such as a relative\'s home or a hospital for an extended outage.</p>';
  html += '</div>';

  html += '<div class="section" id="po-general"><h2>&#128161; General Outage Steps</h2><ul>'+
    '<li>Unplug sensitive electronics to protect them from a power surge when service is restored.</li>'+
    '<li>Keep one corded phone on hand - it does not need separate power the way most cordless phones do.</li>'+
    '<li>Leave one light switched on so you know when power returns.</li>'+
    '<li>Conserve device and vehicle battery use for when it is actually needed.</li>'+
  '</ul></div>';
  return html;
}

/* ---- Infants, Elderly & Pets ---- */
function renderSpecialNeeds(){
  var html = '<div class="breadcrumb"><button data-go="home">&larr; Home</button></div>';
  html += '<div class="section"><h2>&#128118; Infants, Elderly &amp; Pets</h2>';
  html += '<p>The parts of a preparedness plan that are easy to forget until they are needed.</p>';
  html += '<div class="jump-row">'+
    '<a class="jump-chip" href="#sn-infants">Infants &amp; Children</a>'+
    '<a class="jump-chip" href="#sn-elderly">Elderly &amp; Mobility Needs</a>'+

  html += '<div class="section" id="sn-infants"><h2>&#128118; Infants &amp; Young Children</h2>';
  html += '<p>Stock extra formula, diapers, and wipes beyond the standard kit duration, along with any medications a child needs regularly. For formula-fed infants under 6 months, avoid mixing formula with plain untreated water unless following specific package or medical guidance. Pack a comfort item, and keep explanations simple and calm for what is happening, matched to the child\'s age.</p>';
  html += '</div>';

  html += '<div class="section" id="sn-elderly"><h2>&#129491; Elderly &amp; Mobility Needs</h2>';
  html += '<p>Keep an extra supply of all prescription medications along with a written list of dosages, conditions, and allergies. Keep mobility aids - power wheelchairs, scooters, walkers - charged and accessible, along with spare hearing aid batteries and a backup pair of glasses. A written list of physicians and their contact information is worth having on paper, not just a phone. For anyone living alone, consider a medical alert method that does not depend on a working phone line.</p>';
  html += '</div>';

  html += '<div class="section" id="sn-pets"><h2>&#128062; Pets</h2>';
  html += '<p>Stock pet food and water for a comparable duration to the household supply, and keep a carrier or leash ready to go. Keep ID tags current and microchip information up to date. Bring copies of vaccination records - many emergency shelters require them, and some emergency shelters do not accept pets at all, so it is worth knowing which ones near you do before an emergency happens.</p>';
  html += '</div>';

  html += '<div class="section" id="sn-disability"><h2>&#9855; Other Disabilities</h2>';
  html += '<p>Keep essential equipment - mobility aids, communication devices - charged and within reach. Make sure at least one trusted contact outside the household is aware of specific needs and how to help. A service animal should have the same preparation as any pet, plus its working gear kept together and ready.</p>';
  html += '</div>';
  return html;
}

function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function renderQuiz(){
  if(!state.quiz.order){ state.quiz.order = shuffle(QUIZ_QUESTIONS.map(function(_,i){return i;})); state.quiz.idx=0; state.quiz.score=0; state.quiz.answered=0; state.quiz.done=false; }
  var html = '<div class="breadcrumb"><button data-go="home">&larr; Home</button></div>';
  html += '<div class="section"><h2>&#10067; Knowledge Check</h2>';
  if(state.quiz.done){
    html += '<div class="result-card '+(state.quiz.score>=8?"mild":state.quiz.score>=5?"moderate":"severe")+'">';
    html += '<h3>Score: '+state.quiz.score+' / '+QUIZ_QUESTIONS.length+'</h3>';
    html += '<p>This score lives only in memory for this session - nothing is saved.</p></div>';
    html += '<button class="btn primary" id="quiz-retry">&#8635; Retake quiz</button>';
  } else {
    var qi = state.quiz.order[state.quiz.idx];
    var q = QUIZ_QUESTIONS[qi];
    html += '<p style="color:var(--ink-dim)">Question '+(state.quiz.idx+1)+' of '+QUIZ_QUESTIONS.length+' &middot; Score so far: '+state.quiz.score+'</p>';
    html += '<h3>'+esc(q.q)+'</h3><div class="qbtn-list">';
    q.a.forEach(function(ans, ai){
      html += '<button class="qbtn" data-quiz-answer="'+ai+'"><span>'+esc(ans)+'</span></button>';
    });
    html += '</div><div id="quiz-feedback" aria-live="polite"></div>';
  }
  html += '</div>';
  return html;
}

/* ---- Print the whole guide: paper outlives batteries ---- */
function renderTriageFlowFlat(flowId){
  var flow = TRIAGE_FLOWS[flowId];
  var label = (TRIAGE_FLOWS.entry.start.items.filter(function(i){return i.go.split(":")[0]===flowId;})[0]||{}).label || flowId;
  var html = '<div class="section"><h2>'+esc(label)+'</h2>';
  Object.keys(flow).forEach(function(nid){
    var node = flow[nid];
    if(node.type === "q"){
      html += '<p><b>Q: '+esc(node.text)+'</b></p><ul>'+node.options.map(function(opt){
        var target = (TRIAGE_FLOWS[opt.flow || flowId]||{})[opt.next] || {};
        return '<li>'+esc(opt.label)+' &rarr; '+esc(target.title || target.text || opt.next)+'</li>';
      }).join("")+'</ul>';
    } else if(node.type === "result"){
      html += '<div class="result-card '+node.severity+'">'+severityBadge(node.severity)+'<h3>'+esc(node.title)+'</h3>'+renderSteps(node.steps)+'</div>'+renderNotDo(node.notdo);
    }
  });
  return html + '</div>';
}
function renderPrintAll(){
  var html = '<div class="breadcrumb no-print"><button data-go="home">&larr; Home</button></div>';

/* ---------------- EVENT WIRING ---------------- */
function parseGo(goStr){
  var parts = goStr.split(":");
  if(parts[0]==="home") return {view:"home"};
  if(parts[0]==="browse") return {view:"browse"};
  if(parts[0]==="quickref") return {view:"quickref"};
  if(parts[0]==="quiz") return {view:"quiz"};
  if(parts[0]==="printall") return {view:"printall"};
  if(parts[0]==="cat") return {view:"category", cat:parts[1]};
  if(parts[0]==="triage") return {view:"triage", flow:parts[1], node:parts[2]};
  return {view:"home"};
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-go]");
  if(t){ go(parseGo(t.getAttribute("data-go"))); return; }
  var fav = e.target.closest("[data-fav]");
  if(fav){
    var key = fav.getAttribute("data-fav");
    if(state.favorites.has(key)) state.favorites.delete(key); else state.favorites.add(key);
    saveFavorites();
    render();
    return;
  }
  var fitem = e.target.closest("[data-go-fav]");
  if(fitem){ goFav(fitem.getAttribute("data-go-fav")); return; }
  var prev = e.target.closest("[data-viewer-prev]");
  if(prev){ stepViewer(prev.getAttribute("data-viewer-prev"), -1); return; }
  var next = e.target.closest("[data-viewer-next]");
  if(next){ stepViewer(next.getAttribute("data-viewer-next"), 1); return; }
  var qa = e.target.closest("[data-quiz-answer]");
  if(qa){ handleQuizAnswer(parseInt(qa.getAttribute("data-quiz-answer"))); return; }
  var qretry = e.target.closest("#quiz-retry");
  if(qretry){ state.quiz.order=null; render(); return; }
  var pbtn = e.target.closest("#print-btn");
  if(pbtn){ window.print(); return; }
  if(e.target.closest("#btn-weather")){ runWeatherCheck(); return; }
  if(e.target.closest("#btn-facilities")){ runFacilitiesCheck(); return; }
  if(e.target.closest("#btn-quakes")){ runEarthquakeCheck(); return; }
  if(e.target.closest("#btn-aqi")){ runAirQualityCheck(); return; }
  var strobeBtn = e.target.closest("[data-strobe]");
  if(strobeBtn){ startStrobe(strobeBtn.getAttribute("data-strobe")); return; }
  if(e.target.closest("#strobe-stop")){ stopStrobe(); return; }
});

/* favorites list items use data-go="fav:key" mapping - patch renderFavList to use goFav */
document.addEventListener("click", function(e){

  if(t){ e.stopPropagation(); goFav(t.getAttribute("data-go").split(":").slice(1).join(":")); }
}, true);

function stepViewer(id, dir){
  var steps = VIEWERS[id];
  var wrap = document.querySelector('[data-viewer="'+id+'"]');
  if(!wrap || !steps) return;
  var idx = parseInt(wrap.getAttribute("data-idx")) || 0;
  idx = (idx + dir + steps.length) % steps.length;
  wrap.setAttribute("data-idx", idx);
  wrap.querySelector(".viewer-stage").innerHTML = steps[idx].svg;
  wrap.querySelector(".svg-caption").textContent = steps[idx].cap;
  var dots = wrap.querySelectorAll(".step-dots span");
  dots.forEach(function(d,i){ d.classList.toggle("active", i===idx); });
}

function handleQuizAnswer(ai){
  var qi = state.quiz.order[state.quiz.idx];
  var q = QUIZ_QUESTIONS[qi];
  var correct = ai === q.correct;
  if(correct) state.quiz.score++;
  state.quiz.answered++;
  var fb = document.getElementById("quiz-feedback");
  if(fb){
    fb.innerHTML = '<div class="result-card '+(correct?"mild":"severe")+'" style="margin-top:.8rem"><h3>'+(correct?"Correct!":"Not quite")+'</h3><p>'+esc(q.a[q.correct])+' is the safer answer.</p></div>';
  }
  setTimeout(function(){
    state.quiz.idx++;
    if(state.quiz.idx >= QUIZ_QUESTIONS.length){ state.quiz.done = true; }
    render();
  }, 900);
}

var searchInput = document.getElementById("search-input");
var searchResults = document.getElementById("search-results");
function renderSearch(q){
  q = q.trim().toLowerCase().replace(/['’]/g, "");
  if(!q){ searchResults.classList.remove("show"); searchResults.innerHTML=""; return; }
  var words = q.split(/\s+/).filter(Boolean);
  var matches = SEARCH_INDEX.filter(function(item){
    return words.every(function(w){ return item.kw.indexOf(w) !== -1; });
  }).map(function(item){
    var score = 0, titleLower = item.title.toLowerCase();
    if(titleLower.indexOf(q) !== -1) score += 100;
    words.forEach(function(w){ if(titleLower.indexOf(w) !== -1) score += 10; });
    if(item.go && item.go.view === "triage") score += 25;
    return {item:item, score:score};
  }).sort(function(a,b){ return b.score - a.score; }).map(function(x){ return x.item; }).slice(0,20);
  if(!matches.length){
    searchResults.innerHTML = '<div class="sr-empty">No results for "'+esc(q)+'"</div>';
  } else {
    searchResults.innerHTML = matches.map(function(m, i){
      return '<button type="button" class="sr-item" data-search-idx="'+i+'"><div class="sr-cat">'+esc(m.cat)+'</div><div class="sr-title">'+esc(m.title)+'</div></button>';
    }).join("");
  }
  searchResults._matches = matches;
  searchResults.classList.add("show");
}
searchInput.addEventListener("input", function(){ renderSearch(searchInput.value); });
searchInput.addEventListener("focus", function(){ if(searchInput.value.trim()) renderSearch(searchInput.value); });
searchResults.addEventListener("click", function(e){
  var t = e.target.closest("[data-search-idx]");
  if(!t) return;
  var m = searchResults._matches[parseInt(t.getAttribute("data-search-idx"))];
  if(m){ go(m.go); searchInput.value=""; searchResults.classList.remove("show"); searchResults.innerHTML=""; }
});
document.addEventListener("click", function(e){
  if(!e.target.closest("#search-wrap")){ searchResults.classList.remove("show"); }
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ searchResults.classList.remove("show"); closeSidebar(); stopStrobe(); }
});

/* ---------------- SCREEN STROBE ---------------- */
function buildSosSequence(unit){
  var seq = [];
  function dot(){ seq.push([unit,true]); seq.push([unit,false]); }
  function dash(){ seq.push([unit*3,true]); seq.push([unit,false]); }
  dot();dot();dot(); seq[seq.length-1][0]=unit*3;
  dash();dash();dash(); seq[seq.length-1][0]=unit*3;
  dot();dot();dot(); seq[seq.length-1][0]=unit*7;
  return seq;
}
function playSosStep(seq, idx, overlay){
  if(state.strobeMode !== "sos") return;
  var step = seq[idx % seq.length];
  overlay.style.background = step[1] ? "#fff" : "#000";
  state.strobeTimer = setTimeout(function(){ playSosStep(seq, idx+1, overlay); }, step[0]);
}
function playStrobeStep(overlay, on){
  if(state.strobeMode !== "strobe") return;
  overlay.style.background = on ? "#fff" : "#000";
  state.strobeTimer = setTimeout(function(){ playStrobeStep(overlay, !on); }, 300);
}
function startStrobe(mode){
  stopStrobe();
  state.strobePrevFocus = document.activeElement;
  state.strobeMode = mode;
  var overlay = document.getElementById("strobe-overlay");
  overlay.classList.add("active");
  var stopBtn = document.getElementById("strobe-stop");
  if(stopBtn) stopBtn.focus();
  if(mode === "sos"){ playSosStep(buildSosSequence(200), 0, overlay); }
  else { playStrobeStep(overlay, true); }
}
function stopStrobe(){
  var wasActive = state.strobeMode !== null;
  state.strobeMode = null;
  if(state.strobeTimer){ clearTimeout(state.strobeTimer); state.strobeTimer = null; }
  var overlay = document.getElementById("strobe-overlay");
  if(overlay){ overlay.classList.remove("active"); overlay.style.background = ""; }
  if(wasActive && state.strobePrevFocus && typeof state.strobePrevFocus.focus === "function"){
    state.strobePrevFocus.focus();
  }
  state.strobePrevFocus = null;
}
